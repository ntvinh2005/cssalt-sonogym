  - frozen_V2_artifacts_are_not_modified
  - static_package_contains_no_pretrained_weights
  - package_references_checksums_and_zip_integrity_pass

allowed_verdicts:
  - MODEL_SAP_PROPOSAL_READY_FOR_REVIEW
  - MODEL_PREDICTION_UNRELIABLE
  - BLOCKED_INPUT_OR_MODEL
  - BLOCKED_ALIGNMENT
