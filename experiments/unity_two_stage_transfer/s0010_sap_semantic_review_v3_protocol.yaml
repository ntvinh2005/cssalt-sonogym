  no_new_ultrasound_capture: true

gates:
  - actual_CT_intensity_volume_matches_sha256
  - CT_and_whole_vertebra_segmentation_affines_match_exactly
  - checkpoint_archive_matches_official_sha256
  - prediction_shape_and_affine_match_input
