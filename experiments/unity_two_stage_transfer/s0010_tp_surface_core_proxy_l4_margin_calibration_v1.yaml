  require_clean_negative_false_positive_reduction: true
  tie_break_order:
    - minimum_clean_negative_false_positives
    - maximum_true_positives
    - minimum_total_false_positives
    - minimum_margin
reporting:
  - total_false_positives
  - clean_negative_false_positives
  - competing_l5_false_positives
  - uncertainty_false_positives
  - other_proxy_exclusion_false_positives
  - true_positives
  - false_negatives
