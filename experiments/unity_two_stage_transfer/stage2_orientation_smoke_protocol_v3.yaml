    The orientation-only controller completed 120 valid bounded actions but remained
    3.747533552289236 degrees from the 3.0-radian command. Existing Phase 5A oracle evidence
    used a 300-step horizon and ended near the command ceiling, supporting one approved
    300-step check without changing the command, target, or acceptance criteria.
