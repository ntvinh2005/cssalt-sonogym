protocol_id: sonogym-stage2-temporal-replay-v1
status: PRE_REPLAY_FROZEN
technical_amendment:
  evidence_job: 51515957
  reason: >-
    The first replay stopped before comparative metrics because producer_sequence can remain equal
    when an already-reached waypoint requires zero simulator action steps. Equality is therefore
    recorded as a non-advancing observation rather than treated as corrupt ordering. Such a frame
    remains available to historical single-frame baselines but cannot provide temporal or
    multi-view support. Decreasing producer_sequence remains invalid.
  scientific_design_unchanged:
    - frozen_models_and_threshold
    - dataset_sources
    - candidate_neighborhood_and_view_separation
    - required_hash_count_and_quality_drop
    - evaluation_targets_and_d3_conditions
    - resource_boundaries
purpose: >-
  Explore whether causal temporal and physically distinct multi-view evidence improves Stage 2
  candidate selection on opened fixed-s0010 captures. This is CPU-only replay, not independent
  confirmation, return-to-best execution, fresh confirmation, V19, or full closed-loop Stage 2.
