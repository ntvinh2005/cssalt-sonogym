information_boundaries:
  actor_allowed:
    - clean_ultrasound_pixels
    - frozen_validity_probability
    - frozen_quality_prediction
    - frame_and_producer_sequence
    - frame_sha256
    - trajectory_identity
    - actually_executed_relative_translation_and_rotation
    - action_acceptance_completion_and_clamp_feedback
    - contact_workspace_and_image_validity_feedback
    - causal_candidate_memory
  actor_forbidden:
    - patient_id
    - raw_labels
    - segmentation
    - command_or_realized_absolute_pose
    - requested_waypoint_or_goal_pose
    - position_or_orientation_error_to_target
    - l4_visible_fraction
    - validity_or_quality_labels
    - evaluator_score
    - future_frames
replay_integrity:
  require_public_privileged_identity_join: true
  require_canonical_image_hash: true
  require_monotonic_frame_sequence_within_session: true
  require_increasing_trajectory_frame_sequence: true
  require_nondecreasing_producer_sequence: true
  require_producer_advance_for_temporal_or_multi_view_support: true
  reset_boundary_source: trajectory_id_and_zero_trajectory_frame_sequence
  forbid_cross_trajectory_evidence: true
  relative_pose_reconstruction: cumulative_executed_delta_within_trajectory_only
  near_duplicate_audit:
    downsample_shape: [20, 15]
    normalized_pixel_rmse_maximum: 0.01
    note: diagnostic_only_not_actor_evidence
decision_rules:
  validity_probability_threshold: 0.5666666666666667
  maximum_neighbor_translation_mm: 4.5
  maximum_neighbor_angle_deg: 6.0
  maximum_quality_drop: 0.08
  required_distinct_hash_observations: 3
  minimum_distinct_view_translation_mm: 1.0
  minimum_distinct_view_angle_deg: 1.0
  selection_time: after_last_recorded_frame_in_each_trajectory
  tie_break_order: [quality_descending, validity_probability_descending, frame_sequence_ascending]
  policies:
    baseline_a_single_frame:
      rule: first_physically_admissible_frame_at_or_above_historical_threshold
    baseline_b_quality_ranked:
      rule: highest_predicted_quality_among_physically_admissible_threshold_accepted_frames
    candidate_c_temporal:
      rule: >-
        Highest-quality threshold-accepted candidate with three distinct hashes from the same
        causal trajectory inside the declared neighborhood, each threshold-accepted and no more
        than 0.08 below candidate predicted quality. Physical viewpoint separation is not required.
    candidate_d_multi_view:
      rule: >-
        Candidate C plus three pairwise distinct physical viewpoints, where every accepted pair is
        separated by at least 1.0 mm translation or 1.0 degree rotation using executed motion.
    diagnostic_quality_only:
      rule: highest_predicted_quality_physically_admissible_frame_without_stop_authority
evaluation:
  evaluator_join_after_actor_decision: true
  primary_target: offline_l4_image_visibility_target
  separate_secondary_target: frozen_10mm_10degree_geometric_evaluator_validity
  frame_metrics_context_only: true
  trajectory_metrics:
    - accepted_candidate_count
    - false_accepted_candidate_count
    - correct_selected_candidate_count
    - incorrect_selected_candidate_count
    - abstention_count
    - accepted_candidate_precision
    - acceptance_coverage
    - decision_latency_observed_frames
    - distinct_supporting_hashes
    - distinct_supporting_viewpoints
  exploratory_d3_promising_when:
    - candidate_d_false_accepts_less_than_baseline_b
    - candidate_d_acceptance_count_at_least_half_baseline_b
    - candidate_d_false_accepts_not_higher_than_baseline_b_in_any_dataset_source
    - candidate_d_accepts_at_least_one_candidate_in_three_dataset_sources
  interpretation: >-
    D3 is exploratory because every dataset is opened. Passing these conditions only supports
    proposing a separately reviewed future protocol; it is not independent confirmation.
scientific_gates:
  D0: replay_integrity_must_pass_or_affected_source_is_excluded_with_reason
  D1: actor_decisions_use_only_causally_available_allowed_fields
  D2: duplicate_same_pose_invalid_motion_reset_and_cross_trajectory_tests_must_pass
  D3: report_exploratory_conditions_without_relabeling_opened_data_as_confirmation
  D4: pure_deterministic_logic_and_required_tests_must_pass
  D5: NOT_RUN_requires_separate_gpu_authorization
  D6: NOT_RUN_requires_full_closed_loop_execution_and_independent_evaluation
resource_bound:
  account: anest-dept
  gpu_count: 0
  cpu_cores: 4
  memory: 16gb
  walltime: "00:30:00"
  output_root: /blue/lampotan/share/vinhnguyen1/cssalt-sonogym-runtime/outputs/unity_two_stage_transfer/stage2_temporal_replay_v1
change_policy:
  - Do not fit, retrain, calibrate or modify either frozen model.
  - Do not alter V16, V17, V18 protocols, thresholds, results or verdicts.
  - Do not sweep or select replay-rule parameters after opening comparative results.
  - Do not synthesize frames or connect evidence across trajectory reset boundaries.
  - Do not launch GPU work, Isaac Sim, V19 or live closed-loop execution.
  - Preserve every declared replay policy result, including negative and abstaining outcomes.
