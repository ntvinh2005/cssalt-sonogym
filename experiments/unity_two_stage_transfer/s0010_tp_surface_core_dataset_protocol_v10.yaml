labels:
  technical_image_valid: finite_nonconstant_contact_workspace_and_transition_valid
  validity: {maximum_position_error_mm: 10.0, maximum_orientation_error_deg: 10.0, minimum_l4_visible_fraction: 0.05}
  quality: {visibility_normalization_fraction: 0.20}
dataset_gate:
  minimum_distinct_frame_hashes_per_session: 8
exact_pose_replay:
  enabled: true
  image_width_pixels: 150
  image_depth_pixels: 200
  label_resolution_m: 0.0015
  image_origin_height_m: 0.133
  maximum_coordinate_error_index: 0.001
  minimum_exact_raw_label_agreement: 0.985
  minimum_bone_mask_iou: 0.90
  require_direct_coordinate_exact_agreement: true
  require_all_frames_to_pass: true
  require_serialized_array_hash_integrity: true
label_preparation:
  surface_slab_tolerance_mm: 1.5
  proposal_column_stride_pixels: 12
  patch_width_pixels: 48
  patch_depth_pixels: 80
  feature_size_pixels: 16
  anatomy_approval_required: true
  image_semantic_review_required: true
training_preflight:
  estimator: ExtraTreesClassifier
  n_estimators: 240
  cpu_threads: 4
  minimum_reviewed_positive_images_per_class: {train: 40, calibration: 10, development_evaluation: 10}
resource_bound:
  account: anest-dept
  gpu_count: 1
  gpu_model: NVIDIA L4
  cpu_cores: 4
  memory: 30gb
  walltime: "00:30:00"
  maximum_storage_growth_gb: 1.0
  maximum_new_gpu_jobs: 1
change_policy:
  - Reuse only projection-verified sessions; never use failed partial sessions.
  - New requested angles remain at or below 2.935 rad.
  - Apply the frozen support-aware selection settings without retuning.
  - Do not weaken replay, freshness, anatomy, semantic-review, or 40/10/10 gates.
  - Do not fit a detector before checksum-bound review import and no-fit readiness.

