  supersedes_protocol_id: sonogym-s0010-tp-surface-core-dataset-v8
  prior_job: 51817719
  reason: >-
    Preserve all projection-verified V6, V7 and V8 sessions. The V8 development session failed
    before materialization because its +0.025 rad offset requested 2.985 rad; the native command
    saturated at 3.00 rad while the realized probe plateaued at 2.93649 rad, leaving 2.7796 degrees
    tracking error against the requested pose. Capture only the missing development split with a
    predeclared bank bounded at 2.94 rad, inside the demonstrated realized angular envelope.
