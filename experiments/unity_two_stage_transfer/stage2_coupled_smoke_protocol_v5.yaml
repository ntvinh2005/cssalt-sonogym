protocol_id: sonogym-stage2-coupled-smoke-v5
status: PRE_GPU_FROZEN
amendment:
  supersedes_protocol_id: sonogym-stage2-coupled-smoke-v4
  prior_sha256: c24d83d5f0c45389fade08e5f5ea6bbd3a22c21e67808a989a63a4825cabf5c5
  evidence_job: 51332269
  reason: >-
    Job 51332269 stopped at coupled step 40 solely because command-space distance was not
    monotonic. The action was finite, correctly mapped, unclamped in position, surface-valid,
    and nonterminal, while the realized pose moved toward the target. Coupled control is based
    on realized-pose error, so command monotonicity under robot lag is not a valid safety gate.
  changed_fields:
    - protocol_id
    - source.implementation_commit
    - resource_bound.output_root
    - stop_policy
  unchanged_design:
    - seed_and_patient
    - controller_and_ratio
    - action_and_step_bounds
    - native_3.0_radian_command_ceiling
    - acceptance_criteria
    - actor_privileged_information_boundary
    - scheduler_resources_and_walltime
  retry_policy: >-
    Execute one justified retry after the concrete guard fix. Preserve PASS, FAIL, or technical
    error and do not retry this smoke again automatically.
purpose: >-
  Determine whether the real robot and ultrasound pipeline can reproduce the Phase 5A
  coupled proportional motion pattern, settle within 5 mm and 1 degree of the maximum supported
  command pose, and produce ten technically valid L4-positive frames.
source:
  implementation_commit: 321b84df3a98f664e20f3d0a3c93315108e7646c
  prior_technical_error_job: 51332269
  blocked_dataset_jobs: [51231922, 51245393, 51245827]
  prior_orientation_jobs: [51274046, 51276637, 51279543]
  phase5a_oracle_job: 50656802
  upstream_sonogym: e67be58334d1a5274f0913af36f56e4b0b7ffe5a
scope:
  task: Isaac-robot-US-guidance-v0
  ultrasound_mode: conv
  patient_id: s0010
  simulator_environments: 1
  model_training: forbidden
  dataset_recapture: forbidden
  ppo_changes: forbidden
  task_reward_action_dynamics_changes: forbidden
  phase5a_protocol_changes: forbidden
information_boundaries:
  actor_record_allowed:
    - clean_ultrasound_pixels
    - frame_sha256
    - frame_and_producer_sequence
    - actually_executed_relative_motion
    - action_acceptance_completion_and_separate_clamp_status
    - contact_workspace_image_validity_booleans
  actor_record_forbidden:
    - patient_id
    - raw_labels
    - segmentation
    - vertebra_mesh_identity
    - absolute_patient_pose
    - requested_command_pose
    - goal_cmd_pose
    - target_distance
    - reward
    - evaluator_score
  privileged_engineering_check_only:
    - evaluator_goal_x_z_for_single_positioning_target
    - requested_and_realized_pose
    - raw_l4_label_28
    - command_and_goal_pose_errors
session:
  session_id: stage2_coupled_smoke_00
  seed: 2026111600
motion:
  controller: coupled_proportional_target
  controller_ratio: [0.02, 0.02, 0.6]
  requested_angle_rad: 3.0
  controller_target_angle_rad: 3.14
  angle_ceiling_policy: >-
    The simulator clips the native command angle at 3.0 radians. Angle-only ceiling clamp is
    expected and recorded; any position clamp is a technical failure.
  sequence:
    - simultaneous_translation_and_rotation_from_realized_pose_error
    - maintain_coupled_feedback_for_fresh_frame_acquisition
  maximum_coupled_steps: 300
  fail_closed_checks:
    - finite_observation_reward_command_and_realized_pose
    - command_mapping_within_tolerance
    - no_position_workspace_clamp
    - surface_proxy_valid
    - no_termination_or_truncation
    - bounded_step_count
criteria:
  required_frame_count: 10
  maximum_command_position_error_mm: 5.0
  maximum_command_orientation_error_deg: 1.0
  maximum_goal_position_error_mm: 10.0
  maximum_goal_orientation_error_deg: 10.0
  minimum_l4_visible_fraction: 0.05
freshness:
  producer_sequence_must_be_strictly_increasing: true
resource_bound:
  account: anest-dept
  gpu_count: 1
  gpu_model: NVIDIA L4
  cpu_cores: 4
  memory: 30gb
  walltime: "00:15:00"
  one_job_at_a_time: true
  maximum_storage_growth_gb: 0.1
  output_root: /blue/lampotan/share/vinhnguyen1/cssalt-sonogym-runtime/outputs/unity_two_stage_transfer/stage2_coupled_smoke_v5
stop_policy:
  - Execute exactly one bounded retry under this protocol.
  - Preserve PASS, FAIL, or technical-error evidence without another automatic retry.
  - Only a complete PASS permits the separately frozen Stage 2 dataset capture.
  - Do not train a model from this job.
