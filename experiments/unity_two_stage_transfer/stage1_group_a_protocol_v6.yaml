protocol_id: sonogym-unity-two-stage-stage1-group-a-v6
phase: 5C
status: DEVELOPMENT_ONLY
amendment:
  supersedes_protocol_id: sonogym-unity-two-stage-stage1-group-a-v5
  prior_development_job_id: 51206842
  prior_decision: FAIL
  reason: >-
    Protocol v5 emitted all 28 landmarks and reconstructed two of four complete
    development maps. It selected one incorrect local L3 peak in ua_00 and one
    incorrect local L2 peak in ua_03 even though valid image-derived alternatives
    existed within tolerance. This revision scores each complete path against
    adjacent landmark separations estimated only from calibration sessions.
  changed_fields:
    - ordered_map.separation_estimation
    - ordered_map.separation_penalty_per_mm
  unchanged_design:
    - capture and session splits
    - patch features and ExtraTrees models
    - actor information boundary
    - 10 mm event tolerance
purpose: >-
  Test whether actor-visible s0010 ultrasound patches and executed Home-relative
  motion can reconstruct one ordered sacrum, S1, and L1-L5 map per session. This
  is fixed-anatomy development evidence, not patient-held-out validation.
