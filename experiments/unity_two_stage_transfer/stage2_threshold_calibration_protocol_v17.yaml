purpose: >-
  Reclassify the preserved V16 NO_GO data as calibration evidence and select one session-robust
  operating threshold for the unchanged V15 ExtraTrees classifier before collecting any V17
  confirmation data. The model, image target, features and final confirmation gates stay fixed.
