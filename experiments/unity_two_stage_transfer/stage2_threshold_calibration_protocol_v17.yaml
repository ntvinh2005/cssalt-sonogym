  memory: 16gb
  walltime: "00:30:00"
  output_root: /blue/lampotan/share/vinhnguyen1/cssalt-sonogym-runtime/outputs/unity_two_stage_transfer/stage2_threshold_calibration_v17
change_policy:
  - Do not change sources, target, rule, model or acceptance criteria after this seal.
  - Preserve CALIBRATION_NO_GO if no threshold clears every frozen requirement.
  - A selected threshold may be used only in a separately sealed new-session V17 confirmation.
  - Do not claim that recalibration changes the preserved V16 CONFIRMATION_NO_GO result.
