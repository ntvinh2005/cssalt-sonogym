    session_ids: [s2v16cf_00, s2v16cf_01, s2v16cf_02, s2v16cf_03]
    frames_per_session: 75
selection_rule:
  candidates: unique_frozen_classifier_probabilities
  minimum_pooled_precision: 0.95
  minimum_unique_hash_precision: 0.95
  require_at_least_one_true_positive_per_session: true
  ranking:
    - maximize_minimum_session_recall
    - maximize_median_session_recall
    - maximize_pooled_recall
