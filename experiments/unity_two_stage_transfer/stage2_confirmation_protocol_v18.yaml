protocol_id: sonogym-stage2-confirmation-v18
status: PRE_GPU_FROZEN
amendment:
  supersedes_protocol_id: sonogym-stage2-confirmation-v17
  prior_sha256: 79e5fe83ff3f99eff199d7f4e4e401fe2b67aa6784ab54caeae351995dc46318
  evidence_job: 51402036
  reason: >-
    V17 showed that pooled calibration did not constrain source-specific precision. CPU job
    51402036 applied the preregistered source-stratified rule across V14, V16 and V17 and selected
    threshold 0.5666666667 without retraining. Confirm this threshold once on four entirely new
    sessions; this is the final binary-classifier confirmation attempt.
  changed_fields:
    - protocol_id
    - amendment
    - purpose
    - source
    - model_confirmation
    - sessions
    - sampling.expected_total_trajectories
    - dataset_gate
    - resource_bound.output_root
  unchanged_design:
    - task_patient_ultrasound_mode
    - public_and_privileged_information_boundaries
    - geometric_evaluator_and_quality_definitions
    - image_features_and_frozen_models
    - numerical_perception_gates
    - physical_controller_and_all_action_bounds
    - trajectory_segmentation_and_native_task_timeout
    - scheduler_resources_and_walltime
  retry_policy: >-
    Execute one bounded four-session capture and one CPU-only frozen-model evaluation. Preserve
    CONFIRMATION_NO_GO on any scientific gate failure. One concrete technical fix permits at most
    one retry; no model, target, threshold, feature, split, trajectory or gate change is allowed.
purpose: >-
  Independently confirm the source-stratified calibrated, otherwise unchanged V15 perception
  bundle on new fixed-s0010 sessions. Preserve exact 10 mm / 10 degree geometric evaluation.
  Permit closed-loop demo implementation only if every frozen perception requirement passes.
