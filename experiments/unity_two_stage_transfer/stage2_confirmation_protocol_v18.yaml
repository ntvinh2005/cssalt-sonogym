  minimum_positive_trajectories:
    confirmation: 0
sampling:
  goal_relative_x_offsets_index: [-4.0, -2.0, 0.0, 2.0, 4.0]
  goal_relative_z_offsets_index: [0.0, 1.0, 2.0, 3.0, 4.0]
  command_angles_rad: [2.9, 2.95, 3.0]
  expected_frames_per_session: 75
  trajectory_start_frames: [0, 10, 20, 30, 40, 50, 60, 70]
  trajectory_seed_stride: 1000
  expected_trajectories_per_session: 8
  expected_total_trajectories: 32
  physical_controller:
    name: coupled_proportional_target
    ratio: [0.02, 0.02, 0.6]
    ceiling_assisted_minimum_requested_angle_rad: 2.98
    controller_target_angle_rad: 3.14
    accept_against_evaluator_goal_angle: true
    capture_angle_ceiling_limited_samples: true
    ceiling_assist_rule: >-
      For the highest-angle stratum only, control and settle toward the unchanged evaluator goal
      angle so the native 3.0-radian ceiling compensates physical lag. Lower angle strata use
      their requested angles and the unchanged 5-degree physical tracking tolerance.
    ceiling_limited_capture_rule: >-
      After the bounded movement loop, capture a candidate only when position is within 5 mm,
      the native angle command is clamped, the position command is not clamped, and every action
      remains finite, mapping-valid, surface-valid and nonterminal. The unchanged evaluator label
      determines whether the captured candidate is valid or invalid.
  maximum_initial_positioning_steps: 300
  maximum_action_steps_per_waypoint: 90
  maximum_total_action_steps_per_session: 4000
  physical_tracking_position_tolerance_mm: 5.0
  physical_tracking_orientation_tolerance_deg: 5.0
