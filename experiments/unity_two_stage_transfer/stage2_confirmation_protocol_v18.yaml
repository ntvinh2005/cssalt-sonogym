change_policy:
  - Do not change sessions, trajectories, labels, thresholds, features, model or gates after seal.
  - Do not train, fit, calibrate or select any parameter on confirmation data.
  - Preserve CONFIRMATION_NO_GO and diagnose before any retry.
  - CONFIRMATION_PASS permits only a separately sealed bounded engineering closed-loop demo; it
    does not establish patient generalization or clinical performance.
  - CONFIRMATION_NO_GO ends binary-classifier threshold iteration; do not launch V19.

