protocol_id: sonogym-s0010-incremental-landmark-map-v1
status: OPENED_DEVELOPMENT_REEVALUATION
purpose: >-
  Replace the same-frame SAP/TP confirmation requirement with actor-owned
  independent landmark confirmation and a shared RIGHT L4/L5 3D map.
source:
  opened_stage2_job: 52505715
  opened_stage2_protocol: s0010_mbb_single_anatomy_poc_protocol_v5r2.yaml
  segmentation_job: 52498821
scope:
  patient_id: s0010
  development_only: true
  simulator_geometry_proxy: true
  independent_confirmation_claim: forbidden
observation_scope: selected_actor_motion_trajectory
landmark_map:
  association_radius_mm: 4.0
  minimum_supporting_views: 2
  minimum_view_translation_mm: 2.0
  minimum_view_rotation_deg: 1.0
  minimum_semantic_confidence: 0.5
  maximum_rms_uncertainty_mm: 4.0
  minimum_hypothesis_score_margin: 0.01
  minimum_sap_tp_distance_mm: 1.0
  maximum_sap_tp_distance_mm: 30.0
acceptance:
  required_landmarks:
    - RIGHT_L4_TP
    - RIGHT_L4_SAP
    - RIGHT_L5_TP
    - RIGHT_L5_SAP
  required_status: CONFIRMED
  required_level_relation_status: CONSISTENT
  pair_precision_gate: 0.75
  clear_negative_false_accept_rate_gate: 0.10
information_boundary:
  actor_allowed:
    - clean_ultrasound_pixels
    - frozen_image_model_probabilities
    - frozen_stage1_anatomical_level
    - synchronized_executed_probe_pose
    - acquisition_freshness_and_contact
    - actor_owned_action_history
  evaluator_only:
    - CT_and_mesh_geometry
    - raw_labels
    - native_pixel_to_volume_coordinates
    - provisional_anatomical_identity_labels
