movement_contracts:
  original_frozen: >-
    Require action accepted and completed, contact and workspace valid, and reject every combined
    action_clamped record exactly as job 51518820 did.
  clamp_consistent_diagnostic: >-
    Preserve every original requirement. Additionally admit an angle-only clamped frame only when
    its source capture protocol explicitly enabled angle-ceiling samples, the public frame was
    accepted and completed, position clamp is false, motion is finite, and every recorded action
    is mapping-valid, surface-valid, nonterminal, nontruncated, and position-unclamped. This is a
    source-specific opened-data diagnostic, not a deployed global ignore-angle-clamp rule.
decision_rules:
  validity_probability_threshold: 0.5666666666666667
  maximum_neighbor_translation_mm: 4.5
  maximum_neighbor_angle_deg: 6.0
  maximum_quality_drop: 0.08
  required_distinct_hash_observations: 3
  minimum_distinct_view_translation_mm: 1.0
  minimum_distinct_view_angle_deg: 1.0
waterfall_order:
  - all_trajectories
  - collector_accepted_observation
  - collector_classifier_candidate
  - at_least_two_raw_distinct_hashes
  - at_least_three_raw_distinct_hashes
  - at_least_two_producer_advanced
  - at_least_three_producer_advanced
  - three_movement_valid_candidates
  - three_in_candidate_neighborhood
  - three_quality_consistent
  - three_distinct_qualifying_hashes
  - three_distinct_qualifying_viewpoints
  - final_temporal_accept
  - final_multi_view_accept
interpretation_gate:
  minimum_material_accept_count: 52
  minimum_sources_with_acceptance: 3
  origin: >-
    Reuse the prior D3 requirement that multi-view retain at least half of the 103 quality-ranked
    accepts and accept in at least three sources. This audit does not choose a new threshold.
  option_1_when: narrow_clamp_diagnostic_meets_both_materiality_conditions
  option_2_otherwise: acquisition_structure_remains_the_primary_next_blocker
information_boundary:
